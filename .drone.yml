kind: pipeline
type: kubernetes
name: default

steps:
  - name: npm-auth
    image: twentyninetech.jfrog.io/default-docker/alpine:3.16.2
    environment:
      NPM_AUTH:
        from_secret: npm_auth
      NPM_EMAIL:
        from_secret: npm_email
    commands:
      - apk add gettext
      - envsubst < .drone/.npmrc > .npmrc

  - name: build
    image: twentyninetech.jfrog.io/default-docker/node:18.7.0-alpine3.16
    volumes:
      - name: m2-cache
        path: /root/.npm
    commands:
      - npm ci
      - npm run build-lib

  - name: deploy-snapshot
    image: twentyninetech.jfrog.io/default-docker/node:18.7.0-alpine3.16
    volumes:
      - name: m2-cache
        path: /root/.npm
    commands:
      - version=`node -p "require('./package.json').version"`
      - npm version --no-git-tag-version $${version}-SNAPSHOT.${DRONE_BUILD_NUMBER}
      - npm publish
    when:
      branch:
        - main
      event:
        - push

  - name: deploy-feature-snapshot
    image: twentyninetech.jfrog.io/default-docker/node:18.7.0-alpine3.16
    volumes:
      - name: m2-cache
        path: /root/.npm
    commands:
      - version=`node -p "require('./package.json').version"`
      - npm version --no-git-tag-version $${version}-SNAPSHOT-${DRONE_BRANCH#feature/}.${DRONE_BUILD_NUMBER}
      - npm publish
    when:
      branch:
        - feature/*
      event:
        - push

  - name: deploy-release
    image: twentyninetech.jfrog.io/default-docker/node:18.7.0-alpine3.16
    volumes:
      - name: m2-cache
        path: /root/.npm
    commands:
      - npm version --allow-same-version --no-git-tag-version ${CI_BUILD_TARGET}
      - npm publish
    when:
      event:
        - promote
  - name: tag-release
    image: docker:git
    commands:
      - git add .
      - git commit -m "Release ${CI_BUILD_TARGET}"
      - git tag ${CI_BUILD_TARGET}
      - git push origin ${CI_BUILD_TARGET}
    when:
      event:
        - promote

volumes:
  - name: npm-cache
    host:
      path: /var/lib/cache/.npm

trigger:
  event:
    - push
    - promote

image_pull_secrets:
  - jfrog-credentials
