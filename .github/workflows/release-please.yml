name: Release

# On every push to main, release-please keeps a release PR up to date from the conventional
# commits since the last release (version bump in package.json, CHANGELOG.md). Merging that PR
# tags the release, creates the GitHub release, and the publish job puts it on npm.
#
# Note: the release PR is opened with GITHUB_TOKEN, and events made with GITHUB_TOKEN do not
# trigger other workflows, so CI does not run on the release PR by itself. To have it run, give
# release-please a fine-grained PAT or a GitHub App token (the action's `token` input).

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # npm trusted publishing: npm exchanges the job's OIDC token for a one-time publish token,
    # so there is no NPM_TOKEN secret. The trusted publisher on npmjs.com names this file.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # trusted publishing needs npm >= 11.5.1
      - name: Ensure npm >= 11.5.1
        run: |
          current="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$current" | sort -V | head -n1)" != 11.5.1 ]; then
            npm install -g npm@^11.5.1
          fi
          npm --version

      - run: npm ci

      - run: npm run build

      # Provenance is added by npm itself under trusted publishing, but only from a public
      # repository: an explicit --provenance makes the publish fail while the repo is private.
      - run: npm publish --access public
